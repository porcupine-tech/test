<!DOCTYPE html>
<html>
<head>
  <title>Connect MetaMask + Show Balance</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.6.0/dist/ethers.umd.min.js"></script>
</head>
<body>
  <button id="connectButton">Connect MetaMask</button>
  <p id="walletAddress"></p>
  <p id="walletBalance"></p>

  <script>
    const connectButton = document.getElementById('connectButton');
    const walletAddress = document.getElementById('walletAddress');
    const walletBalance = document.getElementById('walletBalance');

    connectButton.addEventListener('click', async () => {
      if (typeof window.ethereum !== 'undefined') {
        try {
          // Request MetaMask connection
          const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
          const account = accounts[0];
          walletAddress.textContent = `Connected: ${account}`;

          // Create ethers provider
          const provider = new ethers.BrowserProvider(window.ethereum);

          // Get balance in wei
          const balanceWei = await provider.getBalance(account);

          // Convert to ETH
          const balanceEth = ethers.formatEther(balanceWei);

          walletBalance.textContent = `Balance: ${balanceEth} ETH`;

          console.log("Account:", account);
          console.log("Balance (ETH):", balanceEth);
        } catch (err) {
          console.error("User rejected connection:", err);
        }
      } else {
        alert('MetaMask is not installed! Please install it: https://metamask.io/');
      }
    });
  </script>
</body>
</html>
